name: .NET Core Build, Test, and Artifact Publish

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' 

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Application
      run: dotnet build --configuration Release --no-restore

    - name: Run Tests
      run: dotnet test --configuration Release --no-build --verbosity normal

    # We update the path slightly to capture the core binaries cleanly
    - name: Publish and Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MyConsole-artifact  
        path: |
          bin/Release/
          !bin/Release/**/*.pdb

  # NEW JOB: Packages the previously built artifacts into Docker on a Linux runner
  package-docker:
    runs-on: ubuntu-latest
    needs: build-and-test  # Ensures this only runs if your tests pass!
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    # 1. Download the artifact produced by the Windows job into a dedicated directory
    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: MyConsole-artifact
        path: ./MyConsoleApp-Executable

    # 2. Log into the GitHub Container Registry
    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 3. Extract metadata tags
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: type=sha,format=short

    # 4. Build and push the Docker image 
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
