name: .NET Framework Build and Artifact Publish

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Application
      run: msbuild ConsoleApp1.csproj /p:Configuration=Release

    - name: Publish and Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ConsoleApp1-Executable
        path: |
          bin/Release/
          !bin/Release/**/*.pdb
